<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 1700 660" width="850" height="330" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Generated from examples/minimal/assets/flow.svg with the minimal theme colors. -->
