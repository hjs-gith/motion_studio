    <text x="470" y="215" font-size="22" fill="#6E6E6A" letter-spacing="2">02</text>
    <text x="470" y="290" font-size="46" font-weight="600" fill="#111111">Structure</text>
    <text x="470" y="335" font-size="24" fill="#6E6E6A">outline and script</text>
  </g>
  <g data-step="4">
