    <path d="M825 246 L 842 260 L 825 274" stroke="#6E6E6A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-step="5">
    <rect x="860" y="150" width="300" height="220" rx="6" fill="none" stroke="#111111" stroke-width="3"/>
    <text x="890" y="215" font-size="22" fill="#6E6E6A" letter-spacing="2">03</text>
    <text x="890" y="290" font-size="46" font-weight="600" fill="#111111">Render</text>
    <text x="890" y="335" font-size="24" fill="#6E6E6A">motion and audio</text>
  </g>
  <g data-step="6">
