    <text x="50" y="290" font-size="46" font-weight="600" fill="#111111">Capture</text>
    <text x="50" y="335" font-size="24" fill="#6E6E6A">notes, docs, data</text>
  </g>
  <g data-step="2">
    <path d="M340 260 H 420" stroke="#6E6E6A" stroke-width="3" fill="none"/>
    <path d="M405 246 L 422 260 L 405 274" stroke="#6E6E6A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g data-step="3">
