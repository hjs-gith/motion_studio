    <text x="1310" y="215" font-size="22" fill="#FAFAF8" letter-spacing="2" opacity="0.8">04</text>
    <text x="1310" y="290" font-size="46" font-weight="600" fill="#FAFAF8">Ship</text>
    <text x="1310" y="335" font-size="24" fill="#FAFAF8" opacity="0.85">video, slides, pptx</text>
