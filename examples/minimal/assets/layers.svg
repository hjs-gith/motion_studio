<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Abstract "calm interface": stacked panels with one accent element. -->
  <g data-step="1">
    <rect x="120" y="120" width="560" height="560" rx="8" fill="var(--bg2)" stroke="var(--muted)" stroke-width="2"/>
  </g>
  <g data-step="2">
    <rect x="180" y="190" width="440" height="56" rx="4" fill="none" stroke="var(--text)" stroke-width="2.5"/>
    <path d="M205 218 H 380" stroke="var(--text)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g data-step="3">
    <rect x="180" y="280" width="210" height="190" rx="4" fill="none" stroke="var(--muted)" stroke-width="2.5"/>
    <rect x="410" y="280" width="210" height="190" rx="4" fill="none" stroke="var(--muted)" stroke-width="2.5"/>
    <path d="M205 320 H 330 M205 350 H 300 M435 320 H 560 M435 350 H 520" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g data-step="4">
    <circle cx="505" cy="420" r="28" fill="var(--accent)" stroke="var(--accent)" stroke-width="2"/>
  </g>
  <g data-step="5">
    <rect x="180" y="500" width="440" height="120" rx="4" fill="none" stroke="var(--muted)" stroke-width="2.5"/>
    <path d="M205 545 H 560 M205 580 H 470" stroke="var(--muted)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g data-step="6">
    <path d="M700 200 Q 760 260 700 330" stroke="var(--accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="100" cy="700" r="10" fill="var(--accent)"/>
  </g>
</svg>
